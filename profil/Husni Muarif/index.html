		<script>
			// Pasangan dari public/404.html.
			//
			// 404.html mengubah /colimp/pemenang menjadi /colimp/?/pemenang,
			// lalu blok ini mengembalikannya ke URL asli memakai replaceState
			// SEBELUM React Router membaca lokasi. Tanpa ini, deep link dan
			// refresh di GitHub Pages berakhir di halaman 404.
			(function (l) {
				if (l.search[1] === "/") {
					var decoded = l.search
						.slice(1)
						.split("&")
						.map(function (s) {
							return s.replace(/~and~/g, "&");
						})
						.join("?");
					window.history.replaceState(
						null,
						null,
						l.pathname.slice(0, -1) + decoded + l.hash,
					);
				}
			})(window.location);
		</script>

		<script>
			// Preferensi tampilan dipasang SEBELUM halaman dilukis.
			//
			// Sebetulnya ini tugas src/lib/tampilan.js, tapi React baru jalan
			// setelah bundelnya diunduh. Tanpa blok kecil ini, pembaca bertema
			// gelap melihat kilatan halaman putih dulu setiap membuka tautan, dan
			// pembaca berukuran teks besar melihat seluruh halaman melompat
			// ukuran begitu React selesai dimuat.
			//
			// Kunci dan bentuk datanya harus sama persis dengan tampilan.js.
			(function () {
				// try HANYA membungkus pembacaan penyimpanan. Kalau ia juga
				// membungkus pemeriksaan preferensi sistem, penyimpanan yang
				// diblokir (mode penyamaran, cookie pihak ketiga dimatikan) akan
				// ikut membatalkan tema gelap otomatis — padahal preferensi sistem
				// sama sekali tidak butuh penyimpanan.
				var p = {};
				try {
					p = JSON.parse(localStorage.getItem("colimp-tampilan")) || {};
					// Kunci lama, dari sebelum ukuran dan huruf ikut diatur.
					if (!p.tema) p.tema = localStorage.getItem("colimp-tema");
				} catch (e) {
					// Tidak bisa diingat; pilihan manual diabaikan saja.
				}
				var akar = document.documentElement;

				// Hanya gelap kalau DIMINTA: dipilih sendiri, atau dipilih
				// "sistem" dan sistemnya memang gelap. Tanpa pilihan tersimpan,
				// situs ini terang — bawaannya tidak mengintip setelan perangkat.
				var gelap =
					p.tema === "gelap" ||
					(p.tema === "sistem" &&
						window.matchMedia("(prefers-color-scheme: dark)").matches);
				if (gelap) {
					akar.classList.add("dark");
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute("content", "#1c222c");
				}

				var skala = { kecil: "93.75%", besar: "112.5%", "sangat-besar": "125%" };
				if (skala[p.ukuran]) akar.style.fontSize = skala[p.ukuran];
				if (p.huruf === "sans") akar.dataset.huruf = "sans";
				if (p.bahasa === "en") akar.lang = "en";
			})();
		</script>
