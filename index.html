		<script>
			// Pasangan dari public/404.html.
			//
			// 404.html mengubah /colimp/pemenang menjadi /colimp/?/pemenang,
			// lalu blok ini mengembalikannya ke URL asli memakai replaceState
			// SEBELUM React Router membaca lokasi. Tanpa ini, deep link dan
			// refresh di GitHub Pages berakhir di halaman 404.
			(function (l) {
				if (l.search[1] === "/") {
					var decoded = l.search
						.slice(1)
						.split("&")
						.map(function (s) {
							return s.replace(/~and~/g, "&");
						})
						.join("?");
					window.history.replaceState(
						null,
						null,
						l.pathname.slice(0, -1) + decoded + l.hash,
					);
				}
			})(window.location);
		</script>
